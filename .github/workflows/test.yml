name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported version, keep in sync with gleam.toml
          - gleam-version: "1.17.0"
            check-format: false
          # Latest 1.x release
          - gleam-version: "1"
            check-format: true
    name: test (gleam ${{ matrix.gleam-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          gleam-version: ${{ matrix.gleam-version }}
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam deps download
      - run: gleam test --target erlang
      - run: gleam test --target javascript
      - if: matrix.check-format
        run: gleam format --check src test
